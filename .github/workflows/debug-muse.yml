name: debug-muse
on: {push: {paths: [".github/workflows/debug-muse.yml"]}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          tests = {
            "v1 p1 cat+lvl": "https://www.themuse.com/api/public/jobs?" + urllib.parse.urlencode([("page",1),("category","Data and Analytics"),("level","Internship")]),
            "v1 p0 cat": "https://www.themuse.com/api/public/jobs?" + urllib.parse.urlencode([("page",0),("category","Data and Analytics")]),
            "v1 p1 none": "https://www.themuse.com/api/public/jobs?page=1",
            "v1 p1 lvl": "https://www.themuse.com/api/public/jobs?" + urllib.parse.urlencode([("page",1),("level","Entry Level")]),
            "v2 p1": "https://www.themuse.com/api/public/v2/jobs?page=1",
          }
          for name, url in tests.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "job-search-bot/1.0"})
                  r = urllib.request.urlopen(req, timeout=30); body = r.read().decode()[:200000]
                  d = json.loads(body)
                  res = d.get("results") or []
                  cats = sorted({c.get("name") for x in res for c in x.get("categories", [])})[:12]
                  lv = sorted({c.get("name") for x in res for c in x.get("levels", [])})
                  print(f"::notice title={name}::status={r.status} keys={list(d)[:6]} page_count={d.get('page_count')} total={d.get('total')} n={len(res)} cats={cats} levels={lv}")
              except Exception as e:
                  print(f"::notice title={name}::ERR {type(e).__name__} {str(e)[:200]}")
          PY
