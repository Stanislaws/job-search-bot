name: Daily job digest

on:
  schedule:
    # GitHub cron runs in UTC and doesn't know about daylight saving time, so it fires
    # twice. The bot sends only on the first run at or after 7:00 in Chicago and skips
    # the other one:
    #   13:07 UTC = 7:07 CST (Nov–Mar)   12:07 UTC = 7:07 CDT (Mar–Nov)
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = email + remember jobs · preview = build only (download it from the run's Artifacts)"
        type: choice
        options: [send, preview]
        default: send

permissions:
  contents: write   # to commit state/seen.json and data/jobs_log.csv

concurrency:
  group: job-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m jobbot --scheduled
          elif [ "${{ inputs.mode }}" = "preview" ]; then
            python -m jobbot --dry-run
          else
            python -m jobbot
          fi

      - name: Save the email as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remember what was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: daily digest state $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
